<script src="../_template/arcade.js"></script></head><body>
<div class="nn-wrap"><div class="nn-top"><a href="../">← NETNET ARCADE</a><span class="nn-pill">CABINET 07 · PROTOTYPE</span></div>
<h1 class="nn-title">REBALANCE</h1>
<p class="nn-sub">Tap an <b>overweight</b> asset, then an <b>underweight</b> one, to move 5%. Match every target to clear a level. 5 levels; each extra move beyond the minimum costs +2s. Lowest time wins.</p>
<div class="nn-hud"><span id="lvl">Level 1/5</span><span id="clock">0.0s</span><span id="mv">moves 0</span></div>
<div class="nn-stage"><div id="bars"></div><div class="nn-row"><button class="nn-btn full" id="go">START</button></div></div>
<div class="nn-card" id="forge"></div></div>
<script>
const A=["🥇 GOLD","💻 NVDA","🏛 T-BILL","🏠 HOUSE","🛢 OIL"];
let R,lvN,w,tgt,sel,moves,minMoves,extra,t0,run=false;
function split(n){let u=Array(n).fill(1),left=20-n;while(left>0){u[Math.floor(R()*n)]++;left--}return u.map(v=>v*5)}
function level(){const n=Math.min(5,3+Math.floor(lvN/2));do{w=split(n);tgt=split(n)}while(w.every((v,i)=>v==tgt[i]));sel=-1;moves=0;minMoves=w.reduce((s,v,i)=>s+Math.max(0,v-tgt[i]),0)/5;draw()}
function draw(){bars.innerHTML=w.map((v,i)=>{const d=v-tgt[i];return '<button class="nn-btn ghost full" data-i="'+i+'" style="display:block;text-align:left;margin:6px 0;padding:8px 12px;height:auto;'+(sel==i?"border-color:var(--c);":"")+'"><div style="display:flex;justify-content:space-between"><span>'+A[i]+'</span><span style="color:'+(d==0?"var(--up)":d>0?"var(--dn)":"var(--gold)")+'">'+v+'% → '+tgt[i]+'%</span></div><div style="position:relative;height:10px;background:#1b2944;border-radius:5px;margin-top:6px"><div style="height:100%;width:'+v*2+'%;max-width:100%;background:var(--c);border-radius:5px"></div><div style="position:absolute;top:-3px;left:'+Math.min(99,tgt[i]*2)+'%;width:3px;height:16px;background:#fff"></div></div></button>'}).join("");
 lvl.textContent="Level "+(lvN+1)+"/5";mv.textContent="moves "+moves+" (min "+minMoves+")"}
bars.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||!run)return;const i=+b.dataset.i;
 if(sel<0){if(w[i]>0){sel=i;draw()}return}if(sel==i){sel=-1;draw();return}
 w[sel]-=5;w[i]+=5;moves++;sel=-1;draw();
 if(w.every((v,k)=>v==tgt[k])){extra+=Math.max(0,moves-minMoves);lvN++;if(navigator.vibrate)navigator.vibrate(20);if(lvN>=5)return finish();level()}});
function tick(){if(!run)return;clock.textContent=((performance.now()-t0)/1000+extra*2).toFixed(1)+"s";requestAnimationFrame(tick)}
function finish(){run=false;const s=+(((performance.now()-t0)/1000)+extra*2).toFixed(1);go.style.display="";NN.end({score:s,detail:extra+" extra moves",line:"Rebalanced 5 portfolios in "+s+"s"})}
function reset(){R=NN.rng(NN.seed());lvN=0;extra=0;level();clock.textContent="0.0s"}
go.onclick=()=>{reset();run=true;go.style.display="none";t0=performance.now();NN.track("start");tick()};
NN.onRestart=()=>go.onclick();NN.boot();reset();NN.forge(document.getElementById("forge"),{coin:"$REBAL"});NN.footer();
</script></body></html>
