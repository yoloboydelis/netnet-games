<script>window.NN_GAME={game:"gold-bar",title:"GOLD BAR",color:"#f5c542",unit:"pts",higherIsBetter:true,demoBase:24};</script>
<script src="../_template/arcade.js"></script></head><body>
<div class="nn-wrap"><div class="nn-top"><a href="../">← NETNET ARCADE</a><span class="nn-pill">CABINET 05 · PROTOTYPE</span></div>
<h1 class="nn-title">GOLD BAR</h1>
<p class="nn-sub">Tap to stop the needle inside the <b style="color:var(--gold)">gold zone</b>. Dead centre scores 3. Three misses and you're out. Today's zones are the same for everyone.</p>
<div class="nn-hud"><span id="sc">0 pts</span><span id="lv">❤❤❤</span><span id="st">streak 0</span></div>
<div class="nn-stage" id="stage" style="padding:0;overflow:hidden"><canvas id="cv" width="600" height="260" style="width:100%;height:auto"></canvas>
<button class="nn-btn full" id="tap" style="min-height:120px;font-size:26px;border-radius:0 0 14px 14px">TAP TO START</button></div>
<div class="nn-card" id="forge"></div></div>
<script>
const cv=document.getElementById("cv"),x=cv.getContext("2d"),tap=document.getElementById("tap");
let R,score,lives,streak,round,zone,pos,dir,speed,run=false,last=0,flash=0,msg="";
function newZone(){const w=Math.max(.05,.22-round*.012);zone={c:w/2+.03+R()*(1-w-.06),w}}
function reset(){R=NN.rng(NN.seed());score=0;lives=3;streak=0;round=0;pos=0;dir=1;speed=.55;newZone();hud();draw()}
function hud(){sc.textContent=score+" pts";lv.textContent="❤".repeat(lives)+"·".repeat(3-lives);st.textContent="streak "+streak}
function draw(){x.fillStyle="#0f1729";x.fillRect(0,0,600,260);
 x.fillStyle="#1b2944";x.fillRect(30,110,540,40);
 const zx=30+(zone.c-zone.w/2)*540,zw=zone.w*540;x.fillStyle="#f5c542";x.fillRect(zx,110,zw,40);x.fillStyle="#fff7";x.fillRect(zx+zw/2-3,110,6,40);
 const nx=30+pos*540;x.fillStyle=flash>0?"#ff5f6d":"#38f5ff";x.fillRect(nx-4,90,8,80);
 x.fillStyle="#eaf0fb";x.font="bold 26px system-ui";x.textAlign="center";x.fillText(msg||"XAU/USDG · round "+(round+1),300,60);
 x.fillStyle="#8b9bb8";x.font="18px system-ui";x.fillText("speed "+speed.toFixed(2)+"x · zone "+Math.round(zone.w*100)+"%",300,210)}
function loop(t){if(!run)return;const dt=Math.min(.05,(t-last)/1000);last=t;pos+=dir*speed*dt;if(pos>1){pos=1;dir=-1}if(pos<0){pos=0;dir=1}flash=Math.max(0,flash-dt);draw();requestAnimationFrame(loop)}
function hit(){if(!run){run=true;tap.textContent="TAP!";NN.track("start");msg="";last=performance.now();requestAnimationFrame(loop);return}
 const d=Math.abs(pos-zone.c);if(d<=zone.w/2){const pts=d<zone.w*.12?3:1;score+=pts;streak++;msg=pts==3?"PERFECT +3":"+1";if(navigator.vibrate)navigator.vibrate(15)}
 else{lives--;streak=0;msg="MISS";flash=.3;if(navigator.vibrate)navigator.vibrate([40,40,40])}
 round++;speed=.55+round*.09;newZone();hud();
 if(lives<=0){run=false;tap.textContent="TAP TO START";draw();NN.end({score,detail:round+" rounds",line:"Stopped the gold needle "+score+" pts"})}}
tap.addEventListener("pointerdown",e=>{e.preventDefault();hit()});
addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();hit()}});
NN.onRestart=reset;NN.boot();reset();NN.forge(document.getElementById("forge"),{coin:"$GBAR"});NN.footer();
</script></body></html>
